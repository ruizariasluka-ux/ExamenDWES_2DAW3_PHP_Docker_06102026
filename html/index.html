<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Ayuda al Empleo</title>
    <link rel="stylesheet" href="../estilos/estilos.css">
</head>
<body>
    <h1>Centro de Ayuda al Empleo</h1>
    <h2>Formulario de solicitud</h2>

    <form action="../php/tabla.php" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos" required>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" required>

        <label for="f_nac">Fecha de nacimiento:</label>
        <input type="date" id="f_nac" name="f_nac" required>

        <label for="tlf">Teléfono:</label>
        <input type="tel" id="tlf" name="tlf" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="profesion">Profesión:</label>
        <select id="profesion" name="profesion" required>
            <option value="">Elige una profesión</option>
            <option value="soldadura">Soldadura</option>
            <option value="informatica">Informática</option>
            <option value="socio">Asistencia Sociosanitaria</option>
        </select>

        <p>Jornada:</p>
        <label><input type="radio" name="jornadaParcial" value="1" required> Parcial</label>
        <label><input type="radio" name="jornadaParcial" value="0"> Completa</label>

        <p>Idiomas:</p>
        <label><input type="checkbox" name="idiomas[]" value="Euskera"> Euskera</label>
        <label><input type="checkbox" name="idiomas[]" value="Inglés"> Inglés</label>

        <input type="submit" value="Enviar">
    </form>

    <h2>Ver solicitudes</h2>
    <p><a href="../php/tabla.php?tipo=soldadura">Soldadura</a></p>
    <p><a href="../php/tabla.php?tipo=informatica">Informática</a></p>
    <p><a href="../php/tabla.php?tipo=socio">Asistencia Sociosanitaria</a></p>
</body>
</html>
